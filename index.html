.bil.wr b{font-size:15px}

.sbars{display:flex;gap:4px}.sbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.sbars b{display:block;height:100%;width:0;background:#fff}

.sbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:left}

@keyframes grow{from{width:0}}

.wrap{margin-top:8px}.whero{text-align:center;padding:16px 8px;border-radius:14px;background:linear-gradient(135deg,#2C2C2A,#4A3A2A);color:#F1EFE8}.whero small{font-family:var(--mono);font-size:11px;letter-spacing:2px;opacity:.7}.whero b{display:block;font-family:var(--mono);font-size:40px;font-weight:700;margin:4px 0;color:#9BE5B4}.whero b.c-bad{color:#F0997B}.whero span{font-size:13px;opacity:.85}

/* 6.4 · médailles (bronze → argent → or brillant → holographique animé) */
.med{--s:30px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;position:relative;flex:none;font-size:calc(var(--s)*.5);line-height:1;isolation:isolate;z-index:0;overflow:hidden;vertical-align:middle}
.med>i{font-style:normal;display:block;line-height:1;position:relative;z-index:2;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.med.m0{background:radial-gradient(circle at 35% 30%,#EDB884,#B9773E 60%,#8A5428);box-shadow:inset 0 0 0 2px #7A4A22}
.med.m1{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CDD6 55%,#8E94A0);box-shadow:inset 0 0 0 2px #7E8490,inset 0 0 0 4px #E4E6EB}
.med.m2{background:radial-gradient(circle at 35% 30%,#FFF3B8,#F2C541 50%,#B98512);box-shadow:inset 0 0 0 2px #9A6E0C,inset 0 0 0 4px #F6D873,0 0 10px rgba(242,197,65,.55)}
.med.m2::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.8) 50%,transparent 60%);animation:medShine 3.2s ease-in-out infinite;z-index:1}
.med.m3{background:#1b1030;box-shadow:0 0 12px rgba(160,110,255,.75)}
.med.m3::before{content:"";position:absolute;inset:-30%;background:conic-gradient(#ff5f8f,#ffd36b,#6bffb8,#6bc8ff,#b18cff,#ff5f8f);animation:medSpin 4s linear infinite;z-index:0}
.med.m3::after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#53428a,#1b1030 70%);z-index:1}
.med.m3>i{animation:medPulse 2.2s ease-in-out infinite}
@keyframes medShine{0%,55%{transform:translateX(-90%)}100%{transform:translateX(90%)}}@keyframes medSpin{to{transform:rotate(360deg)}}@keyframes medPulse{50%{transform:scale(1.14)}}
.med.lock{background:var(--soft)!important;box-shadow:inset 0 0 0 2px var(--rule)!important}.med.lock::before,.med.lock::after{display:none}.med.lock>i{filter:grayscale(1);opacity:.35;animation:none;font-family:var(--mono);color:var(--ink3)}

  if (z) z.innerHTML = !f.noms || !f.noms.length ? 'Choisis qui te doit' : montantNum() ? `Ta part : <b>${e2(pa.moi)} €</b> dans ton budget · ${pa.n > 1 ? 'chacun te doit' : esc(f.noms[0]) + ' te doit'} <b>${e2(pa.chacun)} €</b>${pa.auto ? ' (parts égales)' : ''}` : 'Tape le montant total payé';

// Effet de la saisie sur le « par jour » du mois en cours

}
function touche(k) {

  else { if (s.includes(',') && s.split(',')[1].length >= 2) return; if (s.replace(',', '').length >= 7) return; s = s === '0' ? k : s + k; }

}
function vibrer() { if (navigator.vibrate && LS.get('vibre', true)) navigator.vibrate(12); }
function enregistrer() {
  if (S._saveT && Date.now() - S._saveT < 1200) return; // double appui sur ENREGISTRER : ignoré
  const f = S.form, n = Math.round(montantNum() * 100) / 100;
  const ecart = /^Écart/.test((f.lib || '').trim());

  let lib = (f.lib || '').trim() || f.cat;
  { const v = ouvert('voyage') && f.mode === 'add' && f.type === 'Dépense' && f.voy !== false ? voyageActif() : null; if (v && !lib.startsWith(v.nom + ' · ')) lib = v.nom + ' · ' + lib; }
  if (futur && f.mode === 'edit') { $('#ferr').textContent = 'Pour un mois à venir : supprime la ligne et crée un achat prévu'; return; }
  S._saveT = Date.now(); vibrer(); sonCaisse();
  if (futur) {
    const a = { id: uid(), row: null, mois, lib, cat: f.cat, montant: n, jour: f.jour || (f.date ? +f.date.slice(8) : null), y: f.y, m: f.m, fait: false, srv: null, pending: true };

/* ================= V2 · OUTILS ================= */
const FREQS = ['Mensuel', 'Trimestriel', 'Semestriel', 'Annuel'];
const MC = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const GROUPES = ['Revenus', 'Charges fixes', 'Abonnements', 'Vie courante', 'Loisirs', 'Divers', 'Épargne'];
const PARMOIS = { Mensuel: 1, Trimestriel: 1 / 3, Semestriel: 1 / 6, Annuel: 1 / 12 };
const nowYM = () => now.getFullYear() * 12 + now.getMonth() + 1;
const numTxt = t => { const n = parseFloat(String(t || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const txtNum = n => n == null || n === '' || isNaN(n) ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
const typeGroupe = (g, nom) => g === 'Revenus' ? 'Revenu' : g === 'Épargne' ? (/^retrait/i.test(nom) ? 'Retrait' : 'Épargne') : 'Dépense';
function ouvrirSheet() { $('#veil').classList.add('on'); $('#sheet').classList.add('on'); }
function enteteSheet(titre, retour) {

}
function lierChamps() {
  document.querySelectorAll('#sheetIn [data-f]').forEach(i => i.addEventListener('input', ev => {
    S.form[i.dataset.f] = ev.target.value;

}
function usage(nom) { return S.journal.filter(e => !e.deleted && e.cat === nom).length + S.data.echeancier.filter(e => !e.deleted && e.cat === nom).length; }
function appel(action, payload) { enfiler({ op: 'call', id: uid(), action, payload }); }

/* ================= V2 · PRÉVU ================= */
function echTermine(e) { return e.i && (e.i * 12 + (e.freq === 'Mensuel' ? (e.g || 12) : 12)) < nowYM(); }
function echResume(e) {
  const p = [e.freq.toLowerCase(), 'le ' + (e.jour || 1)];
  if (e.freq !== 'Mensuel') p.push('en ' + MC[(e.f || 1) - 1]);
  if (e.h) p.push('dès ' + (e.freq === 'Mensuel' ? MC[(e.f || 1) - 1] + ' ' : '') + e.h);
  if (e.i) p.push("jusqu'à " + (e.freq === 'Mensuel' ? MC[(e.g || 12) - 1] + ' ' : '') + e.i);
  return p.join(' · ');
}
function prochainPassage(e) {
  for (let k = 0; k < 36; k++) {
    const t = nowYM() + k, y = Math.floor((t - 1) / 12), m = ((t - 1) % 12) + 1;
    if (echMontant(Object.assign({}, e, { pause: false }), y, m) && (k > 0 || (e.jour || 1) >= now.getDate())) return `${e.jour || 1} ${MC[m - 1]} ${y}`;

}
function vuePrevu() {

  h += `<button class="add" data-act="ech-new" style="margin-top:10px;background:var(--soft);border-color:color-mix(in srgb,#fff 80%,var(--rule));color:var(--ink);font-weight:600">+ AJOUTER UN PRÉLÈVEMENT OU UN REVENU</button>`;

}
function prevuTout() {

  const actifs = l.filter(e => !echTermine(e)), finis = l.filter(echTermine);

    const c = cm[e.cat], plus = c && (c.type === 'Revenu' || c.type === 'Retrait');
    return `<button class="jl" data-act="ech" data-id="${e.id}" style="${e.pause ? 'opacity:.55' : ''}"><div class="l"><div>${esc(e.lib)} ${e.pause ? '<span class="stamp s-warn" style="margin-left:4px">PAUSE</span>' : ''}${e.pending ? ' <span class="c-mute" style="font-size:11px">· envoi…</span>' : ''}</div><div class="c">${esc(echResume(e))}</div></div><div class="a ${plus ? 'c-ok' : ''}">${plus ? '+' : '−'}${e2(e.montant || 0)}</div></button>`;

    const tot = z.filter(e => !e.pause).reduce((s, e) => s + (e.montant || 0) * (PARMOIS[e.freq] || 1 / 12), 0);
    h += `<div class="sec"><span>${esc(g.toUpperCase())}</span><span>≈ ${e0(tot)}/MOIS</span></div>` + z.map(ligne).join('');
  });
  const orph = actifs.filter(e => !cm[e.cat]);

function stepEch(k, d) {
  const f = S.form, mens = f.freq === 'Mensuel', cy = now.getFullYear(), cm = now.getMonth() + 1;
  if (k === 'jour') f.jour = ((f.jour - 1 + d + 31) % 31) + 1;

  else if (k === 'nm') { const t = f.ny * 12 + f.nm - 1 + d; f.ny = Math.floor(t / 12); f.nm = (t % 12) + 1; }
  else if (k === 'deb' || k === 'fin') {
    const Y = k === 'deb' ? 'h' : 'i', M = k === 'deb' ? 'f' : 'g';
    if (d === 'x') { f[Y] = null; if (mens) f[M] = k === 'deb' ? 1 : 12; }
    else if (!f[Y]) { f[Y] = cy; if (mens) f[M] = cm; }
    else if (mens) { let t = f[Y] * 12 + f[M] - 1 + d; f[Y] = Math.floor(t / 12); f[M] = (t % 12) + 1; }
    else f[Y] += d;

}

function soldeCalcule(y, m, base) {
  const s0 = base != null ? base : soldeDepart(y); if (s0 == null) return null;
  let t = s0; for (let k = 1; k < m; k++) t += calc(y, k).restant;
  if (statut(y, m) !== 'cours') return t + calc(y, m).restant;
  const cm = catMap(), d = now.getDate();
  S.journal.forEach(e => { const c = cm[e.cat]; if (!e.deleted && c && e.y === y && e.m === m && e.montant) t += signe(c.type) * e.montant; });
  occurrences(y, m).forEach(o => { if (o.jour <= d) t += signe(o.type) * o.v; });
  return t;
}
function departCalcule() {
  const f = S.form, b = numTxt(f.banque);
  if (isNaN(b)) { $('#ferr').textContent = "Tape le solde affiché par ta banque aujourd'hui"; return; }

  const total = (f.neg ? -b : b) + (numTxt(f.especes) || 0);

  toast(`Solde au 1er janvier ${y} : ${e2(v)} €`); f.y = y; f.m = m; rendreSolde(); rendre(true);
}

// --- Objectif d'épargne de l'année ---
const objectifs = () => getPref('objectifs', {}) || {};
// Épargne de l'année = tous les versements (catégories Épargne, Journal + Prévu) de janvier à ce mois-ci.
// Les retraits ne sont pas déduits : un retrait de livret se saisit comme un revenu.
function epAnnee(y, retraits) {
  const fin = y < now.getFullYear() ? 12 : y > now.getFullYear() ? 0 : now.getMonth() + 1; let t = 0;
  for (let m = 1; m <= fin; m++) t += retraits ? calc(y, m).epR : calc(y, m).epV;
  return t;
}
function etatObjectif(y) {
  const cible = +objectifs()[y] || 0; if (!(cible > 0)) return null;
  const ep = epAnnee(y), cur = y === now.getFullYear();
  const ecoule = y < now.getFullYear() ? 12 : cur ? now.getMonth() + now.getDate() / dim(y, now.getMonth() + 1) : 0;
  const attendu = cible * ecoule / 12, reste = Math.max(0, cible - ep), moisRest = cur ? 12 - now.getMonth() : 0;
  return { y, cible, ep, frac: Math.max(0, Math.min(1, ep / cible)), attendu, ecart: ep - attendu, reste, parMois: moisRest > 0 ? reste / moisRest : 0, proj: ecoule >= 1 ? ep / ecoule * 12 : null, atteint: ep >= cible - 0.005 };
}

    ${f > 0.001 ? `<path class="objarc" d="M20 100 A80 80 0 0 1 ${x.toFixed(1)} ${yy.toFixed(1)}" fill="none" stroke="${f >= 1 ? 'var(--ok)' : 'url(#objgr)'}" stroke-width="16" stroke-linecap="round"/>` : ''}

    <text x="100" y="88" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="30" font-weight="700" fill="var(--ink)">${Math.round(f * 100)} %</text></svg>`;
}

// --- Résumé du dimanche ---
function resumeCle() { // lundi de la semaine à résumer (dimanche dès 17 h, et toute la journée du lundi)
  const j = now.getDay(), h = new Date().getHours();
  if (j === 0 && h >= 17) return isoJ(lundi(now));
  if (j === 1) { const l = lundi(now); l.setDate(l.getDate() - 7); return isoJ(l); }
  return null;
}
function banniereResume() {
  if (!ouvert('resume')) return '';
  const k = resumeCle(); if (!k || LS.get('resumeVu', '') === k) return '';
  const r = calcResume(k);
  return `<button class="bilban sem" data-act="res-ban" data-k="${k}"><span class="bbp">☾</span><span><b>TA SEMAINE EN BREF</b><small>${e0(r.dep)} de dépenses courantes${r.moy > 0 ? ' · ' + (r.dep <= r.moy ? 'moins' : 'plus') + " que d'habitude" : ''}</small></span><span>›</span></button>`;
}
function depCourantes(a, b) { return S.journal.filter(e => !e.deleted && e.date && e.date >= a && e.date <= b && e.montant > 0 && estCourante(e.cat)); }
function calcResume(k) {
  const l = new Date(k + 'T00:00:00'), fin = new Date(l); fin.setDate(fin.getDate() + 6); const a = k, b = isoJ(fin);
  const L = depCourantes(a, b), dep = L.reduce((t, e) => t + e.montant, 0);
  let t4 = 0; for (let w = 1; w <= 4; w++) { const d0 = new Date(l); d0.setDate(d0.getDate() - 7 * w); const d1 = new Date(d0); d1.setDate(d1.getDate() + 6); t4 += depCourantes(isoJ(d0), isoJ(d1)).reduce((t, e) => t + e.montant, 0); }

  const top = Object.entries(par).sort((x, y) => y[1] - x[1]).slice(0, 3), gros = L.slice().sort((x, y) => y.montant - x.montant)[0] || null;
  const exS = exclusSerie(), jd = new Set(L.filter(e => casseSerie(e.cat, exS)).map(e => e.date)); let sans = 0, vus = 0; const lim = auj();
  for (let i = 0; i < 7; i++) { const d = new Date(l); d.setDate(d.getDate() + i); const s = isoJ(d); if (s > lim) break; if (jourEnVoyage(s)) continue; vus++; if (!jd.has(s)) sans++; }
  const W = semaines()[k], defi = W ? { cat: W.cat, montant: W.montant, dep: depSemaine(W.cat, l) } : null;
  // la semaine qui vient : prélèvements et revenus prévus
  const deb = new Date(fin); deb.setDate(deb.getDate() + 1); const fn = new Date(deb); fn.setDate(fn.getDate() + 6); const av = [];
  [[deb.getFullYear(), deb.getMonth() + 1], [fn.getFullYear(), fn.getMonth() + 1]].filter((x, i, A) => i === 0 || x[1] !== A[0][1]).forEach(([yy, mm]) => {
    occurrences(yy, mm).forEach(o => { if (!o.jour) return; const s = yy + '-' + String(mm).padStart(2, '0') + '-' + String(o.jour).padStart(2, '0'); if (s >= isoJ(deb) && s <= isoJ(fn) && o.type !== 'Revenu' && o.type !== 'Retrait' && o.v > 0) av.push({ lib: o.lib, v: o.v, s }); });

  av.sort((x, y) => y.v - x.v);

}

    case 'mgrid': S.form = { mode: 'mois', y: S.y }; rendreForm(); ouvrirSheet(); break;
    case 'mg:today': S.y = now.getFullYear(); S.m = now.getMonth() + 1; fermer(); rendre(); break;
    case 'jmode': S.jmode = S.jmode === 'solde' ? 'reste' : 'solde'; S.lastBig = null; rendre(true); break;
    case 'stats-an': S.tab = 'stats'; S.statsVue = 'annee'; rendre(); scrollTo(0, 0); break;
    case 'sv:annee': S.statsVue = 'annee'; rendre(true); break;
    case 'sv:mois': S.statsVue = 'mois'; rendre(true); break;
    case 'sv:progres': S.tab = 'stats'; S.statsVue = 'progres'; rendre(); scrollTo(0, 0); break;
    case 'defi-go': ouvrirDefi(); break;
    case 'defi-cat': S.form.cat = el.dataset.cat; if (!S.form.touche) S.form.montant = defiSuggere(S.form.cat); rendreDefi(); break;
    case 'defi-ok': okDefi(); break;
    case 'defi-del': if (!S.form.arm) { S.form.arm = true; rendreDefi(); } else retirerDefi(); break;
    case 'gomois': S.m = +el.dataset.m; S.tab = 'home'; rendre(); scrollTo(0, 0); break;
    case 'fiche': S.form = { mode: 'fiche', cat: el.dataset.cat }; rendreForm(); ouvrirSheet(); break;
    case 'fiche-journal': { const c = S.form.cat; fermer(); S.filtre = { cat: c, q: '', grp: null }; S.tab = 'journal'; rendre(); scrollTo(0, 0); break; }
    case 'bilan-ok': LS.set('bilanVu', el.dataset.key); rendre(true); break;
    case 'bilan-stats': S.y = +el.dataset.y; S.m = +el.dataset.m; S.tab = 'stats'; S.statsVue = 'mois'; rendre(); scrollTo(0, 0); break;
    case 'allcat': S.allCat = !S.allCat; rendre(true); break;
    case 'pin': { const p = LS.get('pins', []), n = el.dataset.cat; LS.set('pins', p.includes(n) ? p.filter(x => x !== n) : p.concat([n])); rendreCats(); break; }
    case 'ordreBud': LS.set('ordreBud', el.dataset.t); rendreReglages(); rendre(true); break;
    case 'seuil': LS.set('seuil', +el.dataset.t); rendreReglages(); rendre(true); break;
    case 'discret': LS.set('discret', !LS.get('discret', false)); if (S.form && S.form.mode === 'reglages') rendreReglages(); rendre(true); break;
    case 'vibre': LS.set('vibre', !LS.get('vibre', true)); rendreReglages(); break;
    case 'aides': LS.set('aidesOff', !LS.get('aidesOff', false)); rendreReglages(); rendre(true); break;
    case 'regfonc': S.regFonc = !S.regFonc; rendreReglages(); break;
    case 'dup': { const e = trouver(S.form.id); if (e) ouvrirSaisie(e, true); break; }
    case 'sgn': S.form.montant = S.form.montant.startsWith('-') ? S.form.montant.slice(1) : '-' + (S.form.montant || ''); majHint(); break;
    case 'libsug': S.form.lib = el.dataset.l; $('#lib').value = el.dataset.l; break;
    case 'hist-clear': if (!S.form.armH) { S.form.armH = true; rendreSolde(); } else { LS.set('controles', []); S.form.armH = false; toast('Historique vidé'); rendreSolde(); } break;
    case 'dep-calc': departCalcule(); break;
    case 'ech-new': ouvrirEch(null); break;
    case 'ech-allcat': S.form.all = !S.form.all; rendreEch(); break;
    case 'ech-cat': S.form.cat = el.dataset.cat; S.form.all = false; rendreEch(); break;
    case 'ech-freq': S.form.freq = el.dataset.t; if (S.form.freq !== 'Mensuel') S.form.g = 12; rendreEch(); break;
    case 'ech-pause': S.form.pause = !S.form.pause; rendreEch(); break;
    case 'stp': stepEch(el.dataset.s, el.dataset.d === 'x' ? 'x' : +el.dataset.d); break;
    case 'ech-save': enregistrerEch(false); break;
    case 'ech-stop': enregistrerEch(true); break;
    case 'ech-del': if (!S.form.arm) { S.form.arm = true; rendreEch(); } else { const x = trouverEch(S.form.id); fermer(); if (x) { x.deleted = true; x.pending = true; rendre(true); toast('Ligne supprimée'); enfiler({ op: 'ech-del', id: x.id }); } } break;
    case 'bud-edit': { const c = cats().find(x => x.nom === el.dataset.cat); S.form.edit = c.nom; S.form.val = txtNum(c.budget); S.form.suivi = c.suivi || 'Mensuel'; rendreBudgets(); break; }
    case 'bud-suivi': S.form.suivi = el.dataset.t; rendreBudgets(); break;
    case 'bud-ok': okBudget(); break;
    case 'cat-new': ouvrirCat(null); break;
    case 'cat-open': ouvrirCat(el.dataset.cat); break;
    case 'cat-mv': deplacerCat(el.dataset.cat, +el.dataset.d); break;
    case 'cat-g': S.form.groupe = el.dataset.t; rendreCatEdit(); break;
    case 'cat-suivi': S.form.suivi = el.dataset.t; rendreCatEdit(); break;
    case 'cat-cible': S.form.cible = el.dataset.cat; S.form.arm = false; rendreCatEdit(); break;
    case 'cat-save': enregistrerCat(); break;
    case 'cat-del': retirerCat(); break;
    case 's-neg': S.form.neg = !S.form.neg; rendreSolde(); break;
    case 's-ok': okSolde(); break;
    case 'dep-ok': okDepart(); break;
    case 'theme': LS.set('theme', el.dataset.t); appliquerTheme(); rendreReglages(); break;
    case 'refresh': fermer(); rafraichir(true); toast('Actualisation…'); break;
    case 'file': S.form = { mode: 'file', arm: false }; rendreForm(); ouvrirSheet(); break;
    case 'file-retry': if (!S.busy) pomper(); toast('Nouvel essai…'); setTimeout(() => { if (S.form && S.form.mode === 'file') rendreFile(); }, 4000); break;
    case 'file-drop': if (!S.form.arm) { S.form.arm = true; rendreFile(); break; } { const o = S.queue.shift(); const e = o && trouver(o.id); if (e) e.pending = false; sauver(); S.form.arm = false; rendreFile(); rendre(true); toast('Envoi abandonné : à ressaisir si besoin'); } break;
    case 'logout': if (!S.form.armOut) { S.form.armOut = true; rendreReglages(); } else { fermer(); oublierCompte(); rendre(); verrouiller(); } break;
    case 'go:lien': S.form = { mode: 'lien', url: S.api }; rendreForm(); break;
    case 'lien-ok': okLien(); break;
  }
});
(function tirerPourActualiser() {
  let y0 = null, ok = false; const ind = $('#ptr');
  document.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && !$('#sheet').classList.contains('on')) ? e.touches[0].clientY : null; ok = false; }, { passive: true });
  document.addEventListener('touchmove', e => { if (y0 == null) return; ok = e.touches[0].clientY - y0 > 80; ind.classList.toggle('on', ok); }, { passive: true });
  document.addEventListener('touchend', () => { if (ok) { S.lastFetch = 0; rafraichir(true); pomper(); toast('Actualisation…'); vibrer(); } ind.classList.remove('on'); y0 = null; ok = false; });
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { const avant = now.toDateString(); majDate(); if (now.toDateString() !== avant || avant !== new Date().toDateString()) rendre(); rafraichir(false); pomper(); } });

/* ================= DÉMARRAGE ================= */
if (!S.key || (!IN_GAS && !S.api)) verrouiller(); else { rendre(); rafraichir(true); pomper(); if (/[?&]saisie=1/.test(location.search)) ouvrirSaisie(null); }
if (!IN_GAS && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
