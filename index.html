@keyframes holo{to{background-position:300% 0}}
.tprev,.pprev,.kprev,.fprev{height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fprev{font-size:30px}
/* collection : onglets, badges */
.ctabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px 4px;scrollbar-width:none}.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:1px;border:1.5px solid var(--rule);border-radius:14px;padding:5px 10px;position:relative}
.ctabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctabs button i{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--paper)}
.cit{position:relative}.nbadge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:1px;background:var(--bad);color:#fff;border-radius:6px;padding:1px 5px;animation:nb 1.8s ease-in-out infinite;z-index:1}
@keyframes nb{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
.nouv{color:var(--badInk);font-weight:700}
.cit.proche{border-style:dashed;border-color:var(--ink2);opacity:.75;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 35%,transparent)}}
.cit:active{transform:scale(.96)}.cit.on .cprev{animation:pop2 .35s ease-out}@keyframes pop2{from{transform:scale(.85)}to{transform:none}}
.lnk{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
/* saison, avent */
.saison{border:1.5px solid var(--rule);border-radius:12px;padding:12px;background:var(--card)}
.avent{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.avent div{aspect-ratio:1;border-radius:7px;border:1.5px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-size:18px}
.avent div small{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.avent div.ouv{border:1.5px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);animation:pop2 .4s ease-out}
.avent div.rat{opacity:.35}
/* alertes */
.alerts{border:1.5px solid var(--warn);border-radius:12px;padding:10px 12px;margin-top:12px;background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.ah{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--warnInk);margin-bottom:4px}
.al{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--rule)}.al:first-of-type{border-top:0}
.al>span{font-size:17px;line-height:1.3}.al p{flex:1;margin:0;font-size:13px}.al button{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--ink3);border:1px solid var(--rule);border-radius:10px;padding:3px 8px;flex:none}
/* prochainement */
.soon{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.soon>span{font-size:16px;opacity:.6}.soon>div{flex:1}.soon b{display:block;font-size:14px}.soon small{display:block;font-size:12px;color:var(--ink2)}
.soon em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--ink3);text-transform:uppercase;border:1px dashed var(--rule);border-radius:10px;padding:2px 7px;white-space:nowrap}
/* mascotte */
.masc{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;z-index:2}
.masc span{font-size:30px;animation:bob 3s ease-in-out infinite;display:block}.masc small{font-family:var(--mono);font-size:10px;color:var(--ink3)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(-4deg)}}
.gauge{position:relative}

<script>
/* ================= CONFIG ================= */
const VERSION = '9.29';
const HEURES_SEMAINE_DEFAUT = 35; // heures de contrat par semaine (réglable dans Achats plaisir)
// Toutes les fonctionnalités (jeu, défis, séries, bilans, alertes, saisons, semaine, résumé, objectif, collection…) sont actives pour tout le monde :
// plus d'interrupteurs dans Réglages. on() reste pour ne pas toucher aux appels ; l'ancienne préférence locale « off » est ignorée.
const on = k => true;
const progresVisible = () => true;
// Optionnel : lien proposé par défaut au premier lancement. Laisser vide pour la version commune.
const API_DEFAUT = 'https://script.google.com/macros/s/AKfycbyq1DoL_nP5dOMlHvWdxubnv2gW63MWgHeZ3wo_ZYZuXotnNHjrIjnXrTmSt5BQYAv90Q/exec';
const API_ATTENDUE = '5.2'; // version minimale du script ; les versions plus récentes sont acceptées
// Compare les versions partie par partie : « 5.10 » est bien plus récent que « 5.2 ».
const versionAuMoins = (v, min) => { const a = String(v || '0').split('.').map(Number), b = String(min).split('.').map(Number); for (let i = 0; i < Math.max(a.length, b.length); i++) { const x = a[i] || 0, y = b[i] || 0; if (x !== y) return x > y; } return true; };

/* ================= OUTILS ================= */
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('jauge-devlin.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jauge-devlin.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('jauge-devlin.' + k); } catch (e) {} }
};
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const MOIS_N = MOIS.map(norm);
const moisLabel = (y, m) => MOIS[m - 1][0].toUpperCase() + MOIS[m - 1].slice(1) + ' ' + y;
function parseMois(s) { const t = norm(s).match(/^([a-z]+)\s+(\d{4})$/); if (!t) return null; const i = MOIS_N.indexOf(t[1]); return i < 0 ? null : { y: +t[2], m: i + 1 }; }
const F2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const F0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const e0 = v => F0.format(Math.round(v)).replace(/ /g, ' ') + ' €';
const e2 = v => F2.format(v).replace(/ /g, ' ');
const sg0 = v => (v > 0.5 ? '+' : '') + e0(v);
const neg2 = v => Math.abs(v) < 0.005 ? e2(0) : '−' + e2(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const dim = (y, m) => new Date(y, m, 0).getDate();
const VAR = ['Vie courante', 'Loisirs', 'Divers'], FIX = ['Charges fixes', 'Abonnements'];
// Argent avancé pour d'autres : + quand tu paies pour quelqu'un, − quand il te rembourse. Libellé « Prénom · objet ».
const CAT_AV = 'Avances (on me doit)', estAv = n => /^Avances/i.test(String(n || ''));

/* ================= ÉTAT ================= */
let now = new Date();
const S = {
  data: null, journal: [], queue: LS.get('queue', []), key: LS.get('key', ''), api: (() => { const ok = /\/exec\/?$/.test(API_DEFAUT); if (ok && LS.get('apiDefautVu', '') !== API_DEFAUT) { LS.set('apiDefautVu', API_DEFAUT); LS.set('api', API_DEFAUT); } return LS.get('api', '') || (ok ? API_DEFAUT : ''); })(),
  tab: 'home', y: now.getFullYear(), m: now.getMonth() + 1,
  filtre: { cat: null, q: '' }, busy: false, lastFetch: 0, lastFrac: 0, anomOpen: false, form: null
};
(function chargerCache() {
  const c = LS.get('cache', null);
  if (c && c.data) { S.data = c.data; S.journal = c.journal || []; }
})();
function prepData(d) {
  (d.echeancier || []).forEach(e => { e.id = 'e' + e.ligne; e.srv = { lib: e.lib, cat: e.cat, montant: e.montant }; });
  (d.avenir || []).forEach(a => { a.id = 'a' + a.row; const p = parseMois(a.mois); a.y = p ? p.y : null; a.m = p ? p.m : null; a.srv = { lib: a.lib, cat: a.cat, montant: a.montant }; });
  return d;
}
function sauver() { LS.set('cache', { data: S.data, journal: S.journal }); LS.set('queue', S.queue); }
function entriesFromData(d) {
  return d.journal.map(r => { const p = parseMois(r.mois); const base = { mois: r.mois, lib: r.lib, cat: r.cat, montant: typeof r.montant === 'number' ? r.montant : Number(r.montant) }; return Object.assign({ id: 'r' + r.row, row: r.row, date: r.date || null, especes: !!r.especes, enLigne: !r.especes && !!r.enLigne, y: p ? p.y : null, m: p ? p.m : null, srv: Object.assign({}, base, { montant: r.montant }) }, base); });
}

/* ================= THÈME ================= */
function themeDeBase() { // réglage clair/sombre de la personne, avant cosmétiques
  const t = LS.get('theme', 'auto');
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').content = dark ? '#0F0F0E' : '#2C2C2A';
}
function appliquerTheme() {
  themeDeBase();
  try { appliquerCosmetiques(); } catch (e) { /* modules pas encore chargés au tout premier appel */ }
}
appliquerTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerTheme);

/* ================= API ================= */
function api(action, extra) {
  const body = JSON.stringify(Object.assign({ action, key: S.key }, extra || {}));
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(t => res(JSON.parse(t))).withFailureHandler(rej).api(body));
  return fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' })
    .then(async r => { const t = await r.text(); if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120));
      try { return JSON.parse(t); } catch (e) { throw new Error('Réponse inattendue du script (souvent : autorisation Google à redonner ou déploiement à refaire) · ' + t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120)); } });
}
function setSync(s) { $('#dot').className = 'dot' + (s === 'sync' ? ' sync' : s === 'off' ? ' off' : ''); }

async function rafraichir(force) {
  if (!S.key) return;
  // Envois en attente : on actualise quand même (G1), sauf s'il y en a qu'on ne sait pas remettre par-dessus le fichier.
  if (!fusionPossible()) return;
  if (!force && Date.now() - S.lastFetch < 20000) return;
  S.lastFetch = Date.now();
  const gen = S.gen || 0;
  try {
    const r = await api('data');
    if (!r.ok) { if (r.error === 'CLE' || r.error === 'SANS_CLE') return verrouiller(r.message); throw new Error(r.message); }
    // Une écriture a eu lieu pendant la lecture (ou un envoi est encore en route) : ces données sont peut-être déjà périmées, on les ignore.
    if (S.busy || (S.gen || 0) !== gen || !fusionPossible()) { S.lastFetch = 0; return; }
    // Une fiche est ouverte : les numéros de ligne pourraient changer sous ses pieds. On actualisera à sa fermeture.
    if (S.form) { S.majEnAttente = true; S.lastFetch = 0; return; }
    const d = prepData(r.data), J = entriesFromData(r.data);
    fusionnerAttente(d, J);
    S.data = d; S.journal = J; memo = new Map();
    sauver(); setSync(S.queue.length ? (S.queue.some(o => o.essais) ? 'off' : 'sync') : 'ok');
    rendre(true);
  } catch (e) { setSync('off'); }
}
// G1 · Actualiser malgré des envois en attente : on repart du fichier, puis on remet par-dessus ce qui n'est pas encore parti.
// Catégories (ajout, renommage, retrait) : effets en cascade sur les lignes, pas d'actualisation tant qu'elles attendent.
// Envoi « incertain » (coupure réseau : le fichier l'a peut-être déjà écrit) : pareil, pour ne pas afficher de doublon.
const CALLS_FUSION = ['pref-set', 'defi', 'budget', 'solde-dep', 'solde-ctrl'];
const fusionPossible = () => !S.queue.some(o => o.incertain || (o.op === 'call' && !CALLS_FUSION.includes(o.action)));
const memeJ = (a, b) => !!(a && b) && a.mois === b.mois && a.lib === b.lib && a.cat === b.cat && Math.abs(Number(a.montant) - Number(b.montant)) < 0.005;
const memeE = (a, b) => !!(a && b) && a.lib === b.lib && a.cat === b.cat && Math.abs(Number(a.montant) - Number(b.montant)) < 0.005;
// Remet un élément local en attente dans la liste neuve L. Sans numéro de ligne (ajout pas encore écrit) : ajouté à la fin.
// Avec : il remplace la ligne de même numéro (contenu identique à « srv » ou changé dans le fichier : la version locale reste, le serveur tranchera par CHANGE).
function remettre(L, x, cle, meme, locaux) {
  const n = x[cle];
  let i = n == null ? -1 : L.findIndex(z => !locaux.has(z) && z[cle] === n && meme(z.srv, x.srv));
  if (i < 0 && n != null) i = L.findIndex(z => !locaux.has(z) && z[cle] === n);
  if (i < 0) L.push(x); else L[i] = x;
  locaux.add(x);
}
function fusionnerAttente(d, J) {
  if (!S.queue.length) return;
  const ids = new Set(); S.queue.forEach(o => { if (o.op !== 'call') ids.add(o.id); if (o.jid) ids.add(o.jid); });
  const locaux = new Set(), dedoubler = L => { const vus = new Set([...locaux].map(z => z.id)); L.forEach(z => { if (!locaux.has(z) && vus.has(z.id)) z.id += '.' + uid(); }); };
  // Journal : ajouts, modifications, suppressions (masquées) en attente, et la ligne d'un achat prévu payé.
  S.journal.filter(e => ids.has(e.id)).forEach(e => remettre(J, e, 'row', memeJ, locaux)); dedoubler(J);
  // Échéancier et achats à venir : même principe (numéro de ligne « ligne » / « row »).

/* ---- contrôle du solde ---- */
function signe(type) { return type === 'Revenu' || type === 'Retrait' ? 1 : -1; }
// Solde au 1er janvier : celui saisi pour l'année, sinon la fin calculée de l'année d'avant (au plus 2 ans en arrière) (C7).
function soldeDepart(y, k) { const s = S.data && S.data.soldes ? S.data.soldes[String(y)] : null; if (typeof s === 'number' && Math.abs(s) > 1) return s; return (k || 0) < 2 ? soldeFin(y - 1, 12, (k || 0) + 1) : null; }
function ouvrirSolde() {

  S.form = { mode: 'solde', y: now.getFullYear(), m: now.getMonth() + 1, banque: '', especes: es.esp ? txtNum(es.esp) : '', dep: '', neg: false, salDeja: false, ret: false, rm: '', rd: auj() };
  rendreForm();
}
/* ---- espèces : ce qui est sur le compte / ce qui est en poche ----
   Préférence synchronisée « especes » : { depuis: 'aaaa-mm-jj' (jour du dernier contrôle), base: espèces déclarées ce jour-là,
   deja: espèces payées ce jour-là déjà saisies avant le contrôle (déjà déduites de base), r: [{ d, m }] retraits depuis }.
   Espèces = base + retraits − dépenses « payé en espèces » datées depuis le contrôle. Banque = total calculé − espèces.
   Le total (jauge, courbe, prévisions) ne change pas : on ne fait que le découper en deux. */
function prefEsp() { const p = getPref('especes', null); return p && typeof p === 'object' && !Array.isArray(p) ? p : null; }
// Montant net payé en espèces (dépenses +, rentrées − : un remboursement d'avance reçu en liquide, ligne négative d'Avances, fait donc MONTER les espèces), lignes datées à partir de « depuis » (ou ce jour-là seulement)
function sommeEspeces(depuis, seulJour) {
  const cm = catMap(); let t = 0;
  S.journal.forEach(e => {
    if (e.deleted || !e.especes || !e.montant) return;
    if (seulJour ? e.date !== seulJour : depuis && (!e.date || e.date < depuis)) return;
    const c = cm[e.cat]; t -= (c ? signe(c.type) : -1) * e.montant;
  });
  return Math.round(t * 100) / 100;
}
function etatEspeces() {
  const p = prefEsp(), c = (S.data && S.data.controle) || {};
  // Sans préférence (contrôle fait avant cette version) : on part des espèces du fichier ; toute ligne « espèces » est forcément plus récente.
  const base = p && typeof p.base === 'number' ? p.base : (typeof c.especes === 'number' ? c.especes : 0);
  const depuis = p && p.depuis || null, r = p && Array.isArray(p.r) ? p.r : [];
  const ret = r.reduce((t, x) => t + (+x.m || 0), 0), dep = sommeEspeces(depuis), deja = p && +p.deja || 0;
  const v = Math.round((base + ret - dep + deja) * 100) / 100;
  return { brut: v, esp: Math.max(0, v), neg: v < -0.005, base, ret, dep: Math.round((dep - deja) * 100) / 100, depuis, r };
}
// Banque estimée aujourd'hui = total calculé − espèces en poche
function partageSolde(total) { const es = etatEspeces(); return Object.assign(es, { banque: Math.round((total - es.esp) * 100) / 100 }); }

function sousTitreEspeces(total) {
  if (total == null) return '<small class="lblsub">banque + espèces</small>';
  const s = partageSolde(total);
  return `<small class="lblsub">banque <span class="espv">${e0(s.banque)}</span> · espèces <span class="espv">${e0(s.esp)}</span></small>${s.neg ? `<small class="espw">⚠ ${AVERT_ESP}</small>` : ''}`;
}
// Saisie : effet de « Payé en espèces » sur ce qui reste en poche
function majEspHint() {
  const f = S.form, z = $('#esphint'); if (!z) return;
  z.style.display = f.especes ? 'block' : 'none'; if (!f.especes) return;
  const es = etatEspeces(); let n = montantNum();
  if (f.mode === 'edit') { const e = trouver(f.id); if (e && e.especes && (!es.depuis || (e.date && e.date >= es.depuis))) n -= e.montant; }
  const apres = Math.round((es.brut - n) * 100) / 100;
  z.innerHTML = `Espèces en poche : ${e2(es.esp)} € → <b>${e2(Math.max(0, apres))} €</b>` + (apres < -0.005 ? `<br><span class="c-warn">Plus que ce que tu avais déclaré : refais un contrôle dans ⚙ › Mon solde</span>` : '');

// Retrait au distributeur : banque −X, espèces +X, total inchangé (ce n'est pas une dépense)
function okRetrait() {

  const es = etatEspeces(), p = Object.assign({}, prefEsp() || { depuis: null, base: es.base }), r = (Array.isArray(p.r) ? p.r : []).slice();

function stepEch(k, d) {

/* ---- solde ---- */
function soldeCalcule(y, m, base) {
  const s0 = base != null ? base : soldeDepart(y); if (s0 == null) return null;
  let t = s0; for (let k = 1; k < m; k++) t += calc(y, k).restant;
  if (statut(y, m) !== 'cours') return t + calc(y, m).restant;
  const cm = catMap(), d = now.getDate();
  S.journal.forEach(e => { const c = cm[e.cat]; if (!e.deleted && c && e.y === y && e.m === m && e.montant) t += signe(c.type) * e.montant; });
  occurrences(y, m).forEach(o => { if (o.jour <= d) t += signe(o.type) * o.v; });
  return t;
}

/* ---- fiche catégorie ---- */
function montantCat(cat, y, m) { const p = calc(y, m).par[cat]; return p ? p.j + p.e : 0; }

  const reels = pts.filter(p => !p.fut), moy = reels.length ? reels.reduce((s, p) => s + p.v, 0) / reels.length : 0;
  let anT = 0; for (let k = 1; k <= 12; k++) if (S.y * 12 + k <= nowYM()) anT += montantCat(f.cat, S.y, k);

// Avant : « retour » sur Android sortait de la page de l'appli (écran noir, il fallait la relancer).
// Maintenant une entrée d'historique « garde » est posée au-dessus de l'appli : « retour » ferme d'abord ce qui est ouvert
// (story, affiche en plein écran, feuille), sinon revient à l'accueil ; sur l'accueil sans rien d'ouvert, le 1er retour
// reste sur place (petit message), un 2e retour quitte l'appli normalement. Une seule garde à la fois : fermer une feuille
// au ✕ ne désynchronise rien. La garde n'est posée qu'après un premier geste (sinon Chrome la saute) et jamais dans Apps Script.
// iOS : pas de bouton retour ; le balayage depuis le bord fait la même chose que « retour ».
// (9.15) Sur certains téléphones, sortir de la page par « retour » laissait un ÉCRAN BLANC (il fallait fermer l'appli
// depuis les tâches en cours). Désormais « retour » ne fait JAMAIS sortir de l'appli : sur l'accueil sans rien d'ouvert,
// un petit message rappelle d'utiliser le bouton ou le geste « accueil » du téléphone. La garde est reconnue par l'état
// de l'historique (et plus par un drapeau), ce qui reste juste après une mise en veille, un rechargement ou deux retours rapides.
const estGarde = () => { try { return !!(history.state && history.state.jauge === 'garde'); } catch (e) { return false; } };

    if (estGarde()) return; // on revient « en avant » sur la garde : rien à faire
    const st = document.querySelector('.story'), pl = $('#plein');

    else if (S.tab !== 'home') { S.tab = 'home'; S.filtre.cat = null; S.filtre.grp = null; rendre(); scrollTo(0, 0); }
    else toast("Tu es sur l'accueil. Pour quitter, utilise le bouton ou le geste « accueil » du téléphone");
